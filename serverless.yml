# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: lizzardy
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: sg-backend
# "service" is the name of this project. This will also be added to your AWS resource names.
service: SG

frameworkVersion: '3'

plugins:
  - serverless-wsgi
  - serverless-python-requirements
  - serverless-dynamodb
  - serverless-offline

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}

  # Table names
  usersTableName: users-table-${self:custom.stage}
  attendanceTableName: attendance-table-${self:custom.stage}
  gradesTableName: grades-table-${self:custom.stage}

  wsgi:
    app: app.app
    packRequirements: false

  pythonRequirements:
    dockerizePip: false
    slim: true
    strip: false

  dynamodbPorts:
    dev: 8005       # <-- cambiado de 8001 a 8005 para evitar conflictos
    local: 8000
    test: 8002
    prod: 8003

  dynamodb:
    stages:
      - dev
      - local
      - test
    start:
      port: ${self:custom.dynamodbPorts.${self:custom.stage}, 8001}  # <-- actualizado también aquí
      inMemory: true
      heapInitial: 200m
      heapMax: 1g
      migrate: true
      seed: true
      convertEmptyValues: true
      noStart: false
    seed:
      domain:
        sources:
          - table: ${self:custom.usersTableName}
            sources: [./scripts/seed-data.json]
          - table: ${self:custom.attendanceTableName}
            sources: [./scripts/attendance-seed.json]
          - table: ${self:custom.gradesTableName}
            sources: [./scripts/grades-seed.json]


  

provider:
  name: aws
  runtime: python3.11
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  timeout: 30
  memorySize: 512
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
            - Fn::GetAtt: [AttendanceTable, Arn]
            - Fn::GetAtt: [GradesTable, Arn]
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [AttendanceTable, Arn]
                - "index/*"
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [GradesTable, Arn]
                - "index/*"
  environment:
    USERS_TABLE: ${self:custom.usersTableName}
    ATTENDANCE_TABLE: ${self:custom.attendanceTableName}
    GRADES_TABLE: ${self:custom.gradesTableName}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
    STAGE: ${self:custom.stage}

functions:
  api:
    handler: wsgi_handler.handler
    events:
      - http:
          path: /
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
      - http:
          path: /{proxy+}
          method: any
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.usersTableName}

    AttendanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentDateIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.attendanceTableName}

    GradesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: subject
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentSubjectIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: subject
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.gradesTableName}

  Outputs:
    UsersTableName:
      Value: ${self:custom.usersTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-UsersTableName
    
    AttendanceTableName:
      Value: ${self:custom.attendanceTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-AttendanceTableName
    
    GradesTableName:
      Value: ${self:custom.gradesTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-GradesTableName
    
    ApiUrl:
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:custom.region}
            - ".amazonaws.com/"
            - ${self:custom.stage}
      Export:
        Name: ${self:service}-${self:custom.stage}-ApiUrl
