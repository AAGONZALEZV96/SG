# "org" ensures this Service is used with the correct Serverless Framework Access Key.
#org: lizzardy # Comentado para evitar errores del Dashboard Plugin en LocalStack
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
#app: sg-backend # Comentado para evitar errores del Dashboard Plugin en LocalStack
# "service" is the name of this project. This will also be added to your AWS resource names.
service: SG

frameworkVersion: '3'

plugins:
  - serverless-wsgi # Necesario para la integración Flask/Lambda Runtime Interface Client
  
  - serverless-offline
  - serverless-localstack # Plugin para emular AWS con Docker

package: # <--- Configuración de empaquetado para Serverless
  # Cuando usas imágenes Docker, la mayor parte del empaquetado de Serverless se omite
  # porque Docker construye la imagen. Sin embargo, estas exclusiones son buenas para el repo Git.
  patterns:
    - '!node_modules/**' # Excluir dependencias de Node.js
    - '!venv/**'         # Excluir entorno virtual de Python
    - '!__pycache__/**'  # Excluir cachés de Python
    - '!**/__pycache__/**'
    - '!**/test/**'
    - '!**/tests/**'
    - '!**/dist-info/**'
    - '!**/egg-info/**'
    - '!**/*.txt'
    - '!**/*.md'
    - '!**/*.map'
    - '!**/*.zip'
    - '!**/*.bin'
    - '!**/*.html'
    - '!**/*.rst'
    - '!**/*.xml'
    - '!**/vendor/**'
    - '!**/docs/**'
    - '!**/examples/**'
    - '!**/data/**'
    - '!**/_*.py'
    - '!**/scripts/**' # Excluir tu carpeta scripts (que no va en la Lambda)

    # Las exclusiones específicas para boto3/botocore y urllib3 son ahora gestionadas por el Dockerfile,
    # pero mantenerlas aquí no hace daño.
    - '!botocore/data/**'
    - '!botocore/examples/**'
    - '!botocore/docs/**'
    - '!boto3/docs/**'
    - '!jmespath/**'
    - '!s3transfer/docs/**'
    - '!urllib3/docs/**'
    - '!urllib3/contrib/emscripten/**'


custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}

  # Table names (Nombres de las tablas de DynamoDB)
  usersTableName: users-table-${self:custom.stage}
  attendanceTableName: attendance-table-${self:custom.stage}
  gradesTableName: grades-table-${self:custom.stage}

  wsgi:
    app: app.app # Apunta a la instancia de tu aplicación Flask en app.py
    packRequirements: false # Esto aún es relevante para serverless-wsgi si se usara el empaquetado ZIP, pero para imágenes es menos directo.

  pythonRequirements:

  # Configuración de LocalStack
  localstack:
    host: http://localhost # Host donde LocalStack expone sus servicios (puede ser 127.0.0.1)
    debug: true # Muestra logs detallados de LocalStack
    services: # Servicios de AWS que LocalStack debe emular
      - dynamodb
      - s3
      - lambda
      - sqs
      - cloudformation # Añadido en pasos anteriores
      - logs           # Añadido en pasos anteriores
      - apigateway     # Añadido en pasos anteriores
      - iam            # Añadido en pasos anteriores
    docker: # Configuración para que el plugin gestione el contenedor Docker de LocalStack
      enabled: true # Habilita la gestión de Docker por el plugin
      reuseContainers: true # Reutiliza el contenedor existente para arranques más rápidos

provider:
  name: aws
  runtime: python3.11 # El runtime aún se especifica aquí, aunque la imagen lo anula.
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  timeout: 30 # Tiempo máximo de ejecución para tu Lambda (en segundos)
  memorySize: 512 # Memoria asignada a tu Lambda (en MB)
  iam: # Permisos que tu Lambda necesitará en AWS (para DynamoDB)
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn] # Permiso para la tabla de usuarios
            - Fn::GetAtt: [AttendanceTable, Arn] # Permiso para la tabla de asistencia
            - Fn::GetAtt: [GradesTable, Arn] # Permiso para la tabla de calificaciones
            # Permisos para los índices globales secundarios (GSI) si usas query con ellos
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [AttendanceTable, Arn]
                - "index/*"
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [GradesTable, Arn]
                - "index/*"
  environment: # Variables de entorno disponibles en tu función Lambda
    USERS_TABLE: ${self:custom.usersTableName}
    ATTENDANCE_TABLE: ${self:custom.attendanceTableName}
    GRADES_TABLE: ${self:custom.gradesTableName}
    IS_OFFLINE: "true" # Indica a tu app.py que está en modo offline
    STAGE: ${self:custom.stage}
    LOCALSTACK_HOSTNAME: localhost # Host para que tu app.py se conecte a LocalStack
  
  ecr:
    images:
      api:
        path: ./


functions:
  api: # Define tu función Lambda principal
    # --- ¡CAMBIO CRÍTICO AQUÍ para usar la imagen Docker! ---
    image: # <--- ¡AÑADE ESTA SECCIÓN!
      name: ${self:service}-${self:custom.stage} # El nombre de la imagen Docker que Serverless construirá y usará
      # Si tu Dockerfile no está en la raíz de tu proyecto, usa:
      # dockerfile: ./path/to/Dockerfile

    events: # Eventos que activarán esta función Lambda (HTTP)
      - http:
          # Captura CUALQUIER ruta después de la etapa (ej. /dev/users, /dev/auth/login)
          path: dev/{proxy+} # <--- ¡IMPORTANTE! El /dev/ es parte de la ruta que Flask recibirá
          method: any
          cors: # Configuración CORS para permitir solicitudes desde cualquier origen
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false

resources: # Definición de tus recursos de AWS (tablas DynamoDB)
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST # Modo de facturación (PAY_PER_REQUEST para dev es común)
        TableName: ${self:custom.usersTableName}

    AttendanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes: # Índices secundarios globales
          - IndexName: StudentDateIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.attendanceTableName}

    GradesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: subject
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentSubjectIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: subject
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.gradesTableName}

  Outputs: # Salidas de CloudFormation (útiles para despliegues reales)
    UsersTableName:
      Value: ${self:custom.usersTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-UsersTableName
    
    AttendanceTableName:
      Value: ${self:custom.attendanceTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-AttendanceTableName
    
    GradesTableName:
      Value: ${self:custom.gradesTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-GradesTableName
    
    ApiUrl:
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:custom.region}
            - ".amazonaws.com/"
            - ${self:custom.stage}
      Export:
        Name: ${self:service}-${self:custom.stage}-ApiUrl