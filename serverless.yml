# serverless.yml - VERSIÓN FINAL CON LAMBDA LAYERS (ESTRUCTURA CORREGIDA)

service: sg
frameworkVersion: '3'

plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-localstack

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  usersTableName: users-table-${self:custom.stage}
  attendanceTableName: attendance-table-${self:custom.stage}
  gradesTableName: grades-table-${self:custom.stage}
  
  # La configuración para el plugin debe estar aquí, en 'custom'
  pythonRequirements:
    dockerizePip: false
    layer: true # ¡Esta es la clave! Le dice al plugin que cree una Layer.
  
  localstack:
    host: http://localhost
    debug: true
    services:
      - dynamodb
      - s3
      - lambda
      - cloudformation
      - logs
      - apigateway
      - iam
    docker:
      enabled: true
      reuseContainers: true

provider:
  name: aws
  runtime: python3.12
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  timeout: 30
  memorySize: 512
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:000000000000:table/${self:custom.usersTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:000000000000:table/${self:custom.attendanceTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:000000000000:table/${self:custom.gradesTableName}"
            - "arn:aws:dynamodb:${self:provider.region}:000000000000:table/${self:custom.attendanceTableName}/index/*"
            - "arn:aws:dynamodb:${self:provider.region}:000000000000:table/${self:custom.gradesTableName}/index/*"
  environment:
    USERS_TABLE: ${self:custom.usersTableName}
    ATTENDANCE_TABLE: ${self:custom.attendanceTableName}
    GRADES_TABLE: ${self:custom.gradesTableName}
    IS_OFFLINE: "true"
    STAGE: ${self:custom.stage}
    LOCALSTACK_HOSTNAME: localhost
  
  # Adjuntamos la capa que el plugin crea automáticamente a TODAS las funciones.
  # El plugin la nombra 'PythonRequirementsLambdaLayer' por defecto.
  layers:
    - {Ref: PythonRequirementsLambdaLayer}

package:
  individually: true

functions:
  indexApi:
    handler: backend.src.index.app.handler
    memorySize: 128
    events:
      - http:
          path: 'dev'
          method: get
          cors: true
    package:
      patterns:
        - backend/src/index/app.py
        - backend/src/common/**

  usersApi:
    handler: backend.src.users.app.handler
    memorySize: 256
    events:
      - http: { path: 'dev/users', method: get, cors: true }
      - http: { path: 'dev/users/{userId}', method: get, cors: true }
      - http: { path: 'dev/users', method: post, cors: true }
      - http: { path: 'dev/users/{userId}', method: put, cors: true }
      - http: { path: 'dev/users/{userId}', method: delete, cors: true }
    package:
      patterns:
        - backend/src/users/app.py
        - backend/src/common/**

  authApi:
    handler: backend.src.auth.app.handler
    memorySize: 128
    events:
      - http: { path: 'dev/auth/login', method: post, cors: true }
    package:
      patterns:
        - backend/src/auth/app.py
        - backend/src/common/**

  attendanceApi:
    handler: backend.src.attendance.app.handler
    memorySize: 256
    events:
      - http: { path: 'dev/attendance', method: get, cors: true }
      - http: { path: 'dev/attendance', method: post, cors: true }
    package:
      patterns:
        - backend/src/attendance/app.py
        - backend/src/common/**

  gradesApi:
    handler: backend.src.grades.app.handler
    memorySize: 256
    events:
      - http: { path: 'dev/grades', method: get, cors: true }
      - http: { path: 'dev/grades', method: post, cors: true }
    package:
      patterns:
        - backend/src/grades/app.py
        - backend/src/common/**

# Ya no necesitamos la sección 'layers:' aquí porque el plugin la crea por nosotros.

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.usersTableName}
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    AttendanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.attendanceTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentDateIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    GradesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.gradesTableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: subject
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentSubjectIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: subject
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST