# serverless.yml

# "org" ensures this Service is used with the correct Serverless Framework Access Key.
#org: lizzardy # Comentado para evitar errores del Dashboard Plugin en LocalStack
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
#app: sg-backend # Comentado para evitar errores del Dashboard Plugin en LocalStack
# "service" is the name of this project. This will also be added to your AWS resource names.
service: sg # Nombre del servicio en minúsculas para compatibilidad con ECR (si se usara) y naming conventions

frameworkVersion: '3'

plugins:
  - serverless-wsgi # Necesario para la integración Flask/Lambda Runtime Interface Client
  - serverless-python-requirements # Para empaquetar dependencias Python en ZIP
  - serverless-offline
  - serverless-localstack # Plugin para emular AWS con Docker

package: # <--- ¡REEMPLAZA TODA ESTA SECCIÓN COMPLETA!
  individually: true # Empaquetar cada función de Lambda de forma individual
  patterns:
    - '!**/*' # Excluir TODO por defecto (esta es la clave)
    # --- Incluir solo lo ABSOLUTAMENTE ESENCIAL para el runtime de Lambda ---
    - 'backend/src/**' # Incluye todo tu código modularizado
    - 'requirements.txt' # Necesario para serverless-python-requirements

    # --- Incluir solo las carpetas de dependencias generadas por serverless-python-requirements ---
    # Estas carpetas se crean cuando dockerizePip: true o cuando se empaqueta localmente.
    # No las crees manualmente, el plugin las genera.
    - '.serverless_requirements/**' # Esto es donde serverless-python-requirements pondrá las dependencias
    - '.serverless/requirements/**' # A veces el plugin usa esta ruta también para dependencias.

    # --- Permisos y archivos específicos que Python/Flask/Boto3 necesitan para el runtime si no están en .serverless_requirements ---
    # Esto es más un comodín si el plugin no empaqueta todo correctamente
    - 'bin/**' # Algunos scripts ejecutables que pueden ser necesarios
    - 'lib/**' # Otras librerías que podrían estar en 'lib' en lugar de 'site-packages'
    - 'dist-packages/**' # Algunas distribuciones usan esto

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}

  usersTableName: users-table-${self:custom.stage}
  attendanceTableName: attendance-table-${self:custom.stage}
  gradesTableName: grades-table-${self:custom.stage}

  wsgi:
    # Esta sección ya no tiene un 'app' general porque cada función ahora tiene su propio 'wsgi.app'
    packRequirements: false # Para que serverless-python-requirements empaquete las dependencias

  pythonRequirements:
    dockerizePip: true # <--- ¡MANTÉN ESTO EN TRUE para construir el paquete ZIP en Docker!
    slim: true
    strip: true

  localstack:
    host: http://localhost
    debug: true
    services:
      - dynamodb
      - s3
      - lambda
      - sqs
      - cloudformation
      - logs
      - apigateway
      - iam
      
    docker:
      enabled: true
      reuseContainers: true

provider:
  name: aws
  runtime: python3.11 # El runtime para tus Lambdas (se empaquetarán como ZIPs)
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  timeout: 30
  memorySize: 512 # Puedes ajustar la memoria por función si es necesario
  iam:
    role:
      statements:
        # Los permisos de IAM para todas las tablas pueden ir en un solo rol si todas las Lambdas los necesitan.
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
            - Fn::GetAtt: [AttendanceTable, Arn]
            - Fn::GetAtt: [GradesTable, Arn]
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [AttendanceTable, Arn]
                - "index/*"
            - Fn::Join:
              - "/"
              - - Fn::GetAtt: [GradesTable, Arn]
                - "index/*"
  environment:
    USERS_TABLE: ${self:custom.usersTableName}
    ATTENDANCE_TABLE: ${self:custom.attendanceTableName}
    GRADES_TABLE: ${self:custom.gradesTableName}
    IS_OFFLINE: "true"
    STAGE: ${self:custom.stage}
    LOCALSTACK_HOSTNAME: localhost

functions: # <--- ¡ESTA ES LA SECCIÓN CON TUS MÚLTIPLES LAMBDAS!
  # --- Función para la API de Index (/) o /dev ---
  indexApi:
    handler: backend/src/common/wsgi_handler.handler # Manejador genérico
    runtime: python3.11
    memorySize: 128 # Probablemente más ligera
    events:
      - http:
          path: dev # Ruta para el index (ej. /dev)
          method: get
          cors: true
    wsgi:
      app: backend/src/index/app.app # La instancia Flask para esta función

  # --- Función para la API de Usuarios (users) ---
  usersApi:
    handler: backend/src/common/wsgi_handler.handler
    runtime: python3.11
    memorySize: 256
    events:
      - http:
          path: dev/users # Ruta base para usuarios (ej. /dev/users)
          method: get
          cors: true
      - http:
          path: dev/users/{userId} # Ruta para usuario por ID (ej. /dev/users/123)
          method: get
          cors: true
      - http:
          path: dev/users # Ruta para crear usuario
          method: post
          cors: true
      - http:
          path: dev/users/{userId} # Ruta para actualizar/eliminar usuario
          method: put
          cors: true
      - http:
          path: dev/users/{userId} # Ruta para eliminar usuario
          method: delete
          cors: true
    wsgi:
      app: backend/src/users/app.app # La instancia Flask para esta función

  # --- Función para la API de Autenticación (auth) ---
  authApi:
    handler: backend/src/common/wsgi_handler.handler
    runtime: python3.11
    memorySize: 128
    events:
      - http:
          path: dev/auth/login # Ruta para login
          method: post
          cors: true
    wsgi:
      app: backend/src/auth/app.app

  # --- Función para la API de Asistencia (attendance) ---
  attendanceApi:
    handler: backend/src/common/wsgi_handler.handler
    runtime: python3.11
    memorySize: 256
    events:
      - http:
          path: dev/attendance # Ruta base para asistencia
          method: get
          cors: true
      - http:
          path: dev/attendance # Ruta para crear asistencia
          method: post
          cors: true
    wsgi:
      app: backend/src/attendance/app.app

  # --- Función para la API de Calificaciones (grades) ---
  gradesApi:
    handler: backend/src/common/wsgi_handler.handler
    runtime: python3.11
    memorySize: 256
    events:
      - http:
          path: dev/grades # Ruta base para calificaciones
          method: get
          cors: true
      - http:
          path: dev/grades # Ruta para crear calificaciones
          method: post
          cors: true
    wsgi:
      app: backend/src/grades/app.app



resources: # Definición de tus recursos de AWS (tablas DynamoDB)
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST # Modo de facturación (PAY_PER_REQUEST para dev es común)
        TableName: ${self:custom.usersTableName}

    AttendanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes: # Índices secundarios globales
          - IndexName: StudentDateIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.attendanceTableName}

    GradesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: studentId
            AttributeType: S
          - AttributeName: subject
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: StudentSubjectIndex
            KeySchema:
              - AttributeName: studentId
                KeyType: HASH
              - AttributeName: subject
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.gradesTableName}

  Outputs: # Salidas de CloudFormation (útiles para despliegues reales)
    UsersTableName:
      Value: ${self:custom.usersTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-UsersTableName
    
    AttendanceTableName:
      Value: ${self:custom.attendanceTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-AttendanceTableName
    
    GradesTableName:
      Value: ${self:custom.gradesTableName}
      Export:
        Name: ${self:service}-${self:custom.stage}-GradesTableName
    
    ApiUrl:
      Value:
        Fn::Join:
          - ""
          - - "https://"
            - Ref: ApiGatewayRestApi
            - ".execute-api."
            - ${self:custom.region}
            - ".amazonaws.com/"
            - ${self:custom.stage}
      Export:
        Name: ${self:service}-${self:custom.stage}-ApiUrl